name: Build Android AI OS Magisk Module

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-magisk-zip:
    name: Biên dịch ai.os.bridge & Đóng gói ai_os_bridge.zip
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 2. Tự động nhận diện thư mục gốc dự án
        run: |
          set -euo pipefail
          if [[ -d "android-bridge" && -d "magisk-module" ]]; then
            echo "PROJECT_ROOT=." >> "$GITHUB_ENV"
          elif [[ -d "android-ai-os-prototype/android-bridge" && -d "android-ai-os-prototype/magisk-module" ]]; then
            echo "PROJECT_ROOT=android-ai-os-prototype" >> "$GITHUB_ENV"
          else
            echo "LỖI: Không tìm thấy thư mục android-bridge và magisk-module trong repo."
            ls -la
            exit 1
          fi

      - name: 3. Thiết lập JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Cài đặt Android SDK Platform 35 & Build-Tools 35.0.0
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 5. Thiết lập Gradle 8.11.1 (không cần cài sẵn trên máy)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 6. Biên dịch Android Bridge APK (ai.os.bridge)
        run: |
          set -euo pipefail
          cd "${PROJECT_ROOT}/android-bridge"
          gradle assembleRelease --no-daemon --stacktrace

      - name: 7. Căn chỉnh (zipalign) & Ký APK (apksigner)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          APK_DIR="${PROJECT_ROOT}/android-bridge/app/build/outputs/apk/release"

          if [[ -f "$APK_DIR/app-release-unsigned.apk" ]]; then
            RAW_APK="$APK_DIR/app-release-unsigned.apk"
          else
            RAW_APK="$APK_DIR/app-release.apk"
          fi

          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "Sử dụng Release Keystore từ GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
            KS_PASS="${KEYSTORE_PASS}"
            ALIAS="${KEY_ALIAS}"
            K_PASS="${KEY_PASS:-$KEYSTORE_PASS}"
          else
            echo "Không có GitHub Secrets — tự tạo Release Keystore cục bộ cho bản build này..."
            KS_PASS="aiosbridge2026"
            ALIAS="ai_os_bridge"
            K_PASS="aiosbridge2026"
            keytool -genkeypair -v \
              -keystore /tmp/release.jks \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -alias "$ALIAS" \
              -dname "CN=AI OS Bridge, OU=Systems, O=Android AI OS, L=Hanoi, C=VN" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" "$APK_DIR/app-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$ALIAS" \
            --key-pass "pass:$K_PASS" \
            --out "$APK_DIR/app-release-signed.apk" \
            "$APK_DIR/app-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_DIR/app-release-signed.apk"

      - name: 8. Kiểm tra XML whitelist & Đóng gói Magisk Module (ai_os_bridge.zip)
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y libxml2-utils
          fi
          chmod +x "${PROJECT_ROOT}/magisk-module/build_module.sh"
          "${PROJECT_ROOT}/magisk-module/build_module.sh" \
            "${PROJECT_ROOT}/android-bridge/app/build/outputs/apk/release/app-release-signed.apk"
          unzip -l "${PROJECT_ROOT}/magisk-module/ai_os_bridge.zip"

      - name: 9. Tải lên Artifact ai_os_bridge.zip (sẵn sàng flash Magisk/KernelSU)
        uses: actions/upload-artifact@v4
        with:
          name: ai_os_bridge-magisk-module
          path: |
            ${{ env.PROJECT_ROOT }}/magisk-module/ai_os_bridge.zip
            ${{ env.PROJECT_ROOT }}/android-bridge/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

      - name: 10. Xuất tóm tắt SHA256 & lệnh flash nhanh
        run: |
          ZIP_SHA=$(sha256sum "${PROJECT_ROOT}/magisk-module/ai_os_bridge.zip" | awk '{print $1}')
          APK_SHA=$(sha256sum "${PROJECT_ROOT}/android-bridge/app/build/outputs/apk/release/app-release-signed.apk" | awk '{print $1}')
          {
            echo "## Biên dịch thành công — Android AI OS Magisk Module"
            echo ""
            echo "- **Magisk/KernelSU Module**: \`ai_os_bridge.zip\` (SHA256: \`${ZIP_SHA}\`)"
            echo "- **Signed Bridge APK**: \`app-release-signed.apk\` (SHA256: \`${APK_SHA}\`)"
            echo ""
            echo "### Flash nhanh lên Xiaomi 12 Pro"
            echo '```bash'
            echo "adb push ai_os_bridge.zip /sdcard/Download/ai_os_bridge.zip"
            echo 'adb shell su -c "magisk --install-module /sdcard/Download/ai_os_bridge.zip"'
            echo "adb reboot"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
